<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDSM圈内记账</title>
<style>
:root{
  /* 背景改为更明显的柔和渐变色 */
  --bg-grad: linear-gradient(135deg, #e0f7f0 0%, #f0fdf4 45%, #fef9e7 100%);
  /* 卡片改为半透明白，配合模糊 */
  --card: rgba(255, 255, 255, 0.7);
  --card-2: rgba(255, 255, 255, 0.5);
  --text: #1f2d33;
  --text-light: #7d8f96;
  --border: rgba(255, 255, 255, 0.8);
  --primary: #35c4ad;
  --primary-2: #5adcc4;
  --primary-soft: rgba(53, 196, 173, 0.12);
  --danger: #ef4444;
  --success: #22c55e;
  --warn: #f59e0b;
  /* 阴影更柔和 */
  --shadow: 0 12px 36px rgba(31, 80, 70, 0.08);
  --radius: 18px;
}
[data-theme="dark"]{
  --bg-grad: linear-gradient(135deg, #0d1719 0%, #101d1f 50%, #0b1416 100%);
  --card: rgba(21, 36, 40, 0.7);
  --card-2: rgba(21, 36, 40, 0.5);
  --text: #e6f2ef;
  --text-light: #89a0a5;
  --border: rgba(255, 255, 255, 0.08);
  --primary: #3fd0b6;
  --primary-2: #2aa892;
  --primary-soft: rgba(63, 208, 182, 0.14);
  --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}
/* 背景柔光装饰（模拟参考图的光斑） */
body::before{
  content:'';position:fixed;top:-10%;left:-10%;width:50%;height:50%;
  background:radial-gradient(circle, rgba(90,220,196,0.25) 0%, transparent 70%);
  border-radius:50%;z-index:0;pointer-events:none;filter:blur(60px);
}
body::after{
  content:'';position:fixed;bottom:-10%;right:-10%;width:60%;height:60%;
  background:radial-gradient(circle, rgba(254,249,231,0.8) 0%, transparent 70%);
  border-radius:50%;z-index:0;pointer-events:none;filter:blur(80px);
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 侧边栏（毛玻璃） ============ */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:236px;z-index:150;
  background:var(--card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  padding:66px 14px 18px;
  display:flex;flex-direction:column;
  box-shadow:2px 0 30px rgba(31,80,70,.04);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.sidebar.collapsed{transform:translateX(-100%);}
.brand{
  font-size:16px;font-weight:800;letter-spacing:-.3px;
  color:var(--primary);padding:0 12px 18px;
}
.nav{display:flex;flex-direction:column;gap:6px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:14px;cursor:pointer;
  color:var(--text-light);font-size:14px;font-weight:600;
  transition:.22s;user-select:none;
}
.nav-item span.ico{font-size:17px;width:22px;text-align:center;}
.nav-item:hover{background:var(--primary-soft);color:var(--primary);}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;box-shadow:0 8px 22px rgba(53,196,173,.35);
}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border);}
.theme-toggle{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 16px;border-radius:14px;border:1px solid var(--border);
  background:transparent;color:var(--text-light);
  cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
  transition:.22s;
}
.theme-toggle:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}

.hamburger{
  position:fixed;top:14px;left:14px;z-index:200;
  width:44px;height:44px;border-radius:14px;
  border:1px solid var(--border);background:var(--card);color:var(--text);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:.22s;
}
.hamburger:hover{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;}

/* ============ 主区域 ============ */
.main{
  margin-left:236px;padding:26px 34px 70px;min-height:100vh;
  transition:margin-left .32s cubic-bezier(.4,0,.2,1);
  position:relative;z-index:1;
}
.main.full{margin-left:0;}
.page{display:none;animation:fadeIn .32s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.page-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}

/* ============ 通用组件（毛玻璃卡片） ============ */
.card{
  background:var(--card);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;transition:.25s;
}
.card:hover{box-shadow:0 16px 44px rgba(31,80,70,.12);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

.btn{
  padding:9px 18px;border-radius:12px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:inherit;
  transition:.22s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 16px rgba(53,196,173,.3);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-outline{background:rgba(255,255,255,0.5);border:1.5px solid var(--border);color:var(--text-light);backdrop-filter:blur(10px);}
[data-theme="dark"] .btn-outline{background:rgba(21,36,40,0.5);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.btn-repay{background:rgba(34,197,94,.13);color:#16a34a;}
.btn-repay:hover{background:rgba(34,197,94,.22);}
.btn-add{background:rgba(239,68,68,.12);color:#ef4444;}
.btn-add:hover{background:rgba(239,68,68,.2);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.icon-btn{
  width:40px;height:40px;border-radius:13px;
  border:1.5px solid var(--border);background:rgba(255,255,255,0.6);color:var(--text);
  backdrop-filter:blur(10px);
  font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:.22s;flex-shrink:0;
}
[data-theme="dark"] .icon-btn{background:rgba(21,36,40,0.6);}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;}

input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:10px 14px;border-radius:12px;
  border:1.5px solid var(--border);background:rgba(255,255,255,0.6);color:var(--text);
  font-size:14px;font-family:inherit;outline:none;transition:.2s;
  backdrop-filter:blur(10px);
}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:rgba(21,36,40,0.6);}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:rgba(255,255,255,0.9);}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus,[data-theme="dark"] textarea:focus{background:rgba(21,36,40,0.9);}
textarea{resize:vertical;line-height:1.65;}

.form-group{margin-bottom:15px;}
.form-group label{display:block;font-size:12.5px;font-weight:700;color:var(--text-light);margin-bottom:6px;}
.form-hint{font-size:11.5px;color:var(--text-light);margin-top:5px;}

/* ============ 主页 ============ */
.home-cal-wrap{display:flex;justify-content:center;margin-bottom:26px;}
.cal-btn{
  width:64px;height:64px;border-radius:22px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;font-size:26px;
  box-shadow:0 12px 28px rgba(53,196,173,.38);
  transition:.25s;
}
.cal-btn:hover{transform:translateY(-3px) scale(1.04);}

.home-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:18px;max-width:900px;margin:0 auto;
}
.home-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px;cursor:pointer;transition:.25s;
  min-height:190px;display:flex;flex-direction:column;
}
.home-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(31,80,70,.14);}
.home-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.home-card-head h3{font-size:15px;font-weight:800;}
.home-card-head .arrow{color:var(--text-light);font-size:15px;}
.debt-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px dashed var(--border);
}
.debt-row:last-child{border-bottom:none;}
.debt-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;}
.debt-val{font-size:18px;font-weight:800;color:var(--primary);}
.big-num{font-size:46px;font-weight:900;color:var(--primary);line-height:1.1;}
.big-sub{font-size:12.5px;color:var(--text-light);margin-top:8px;}
.empty-mini{font-size:13px;color:var(--text-light);padding:14px 0;}

.home-links{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap;}
.home-links .btn{padding:11px 24px;border-radius:14px;}

/* ============ 工具栏 ============ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar-right{margin-left:auto;display:flex;gap:8px;}
.search-bar{display:none;gap:8px;margin-bottom:14px;}
.search-bar.show{display:flex;}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{
  padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);
  background:rgba(255,255,255,0.6);color:var(--text-light);backdrop-filter:blur(10px);
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.22s;user-select:none;
}
[data-theme="dark"] .chip{background:rgba(21,36,40,0.6);}
.chip:hover{border-color:var(--primary);color:var(--primary);}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(53,196,173,.28);}

/* ============ 账目卡片 ============ */
.entry-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
.entry-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:14px;align-items:center;
  transition:.25s;
}
.entry-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(31,80,70,.13);}
.entry-main{flex:1;min-width:0;}
.entry-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.entry-tag{
  font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:8px;
  background:var(--primary-soft);color:var(--primary);
}
.entry-desc{font-size:12.5px;color:var(--text-light);margin-top:5px;line-height:1.55;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.entry-qty{font-size:28px;font-weight:900;color:var(--primary);margin-top:8px;line-height:1;}
.entry-interest{font-size:11.5px;color:var(--danger);margin-top:6px;font-weight:600;}
.entry-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}

/* ============ 圈内记录 ============ */
.record-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;cursor:pointer;transition:.25s;
}
.record-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(31,80,70,.13);}
.record-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.record-date{font-size:11.5px;color:var(--text-light);margin-top:5px;}
.record-preview{
  font-size:13px;color:var(--text-light);margin-top:9px;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.type-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:8px;}
.type-badge.diary{background:rgba(53,196,173,.14);color:var(--primary);}
.type-badge.practice{background:rgba(245,158,11,.16);color:#d97706;}

/* ============ 编辑器 / 查看器 ============ */
.overlay{
  position:fixed;inset:0;z-index:400;background:rgba(10,30,30,.35);
  backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s;
}
.overlay.show{display:flex;}
.panel{
  background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:22px;width:680px;max-width:100%;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.28);
  animation:popIn .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);
}
.panel-head h3{font-size:16px;font-weight:800;}
.panel-body{padding:20px 22px;overflow-y:auto;flex:1;}
.panel-foot{
  padding:16px 22px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
}
.close-btn{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,0.5);color:var(--text-light);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
[data-theme="dark"] .close-btn{background:rgba(21,36,40,0.5);}
.close-btn:hover{background:rgba(239,68,68,.12);color:var(--danger);border-color:transparent;}

.segmented{
  display:inline-flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.5);backdrop-filter:blur(10px);
}
[data-theme="dark"] .segmented{background:rgba(21,36,40,0.5);}
.segmented button{
  padding:7px 18px;background:transparent;border:none;cursor:pointer;
  color:var(--text-light);font-size:13px;font-weight:700;font-family:inherit;transition:.2s;
}
.segmented button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;}

.record-view-content{
  font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word;
  color:var(--text);
}

/* ============ 弹窗 ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:600;background:rgba(10,30,30,.35);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s;
}
.modal{
  background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:20px;padding:26px;width:520px;max-width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.28);
  animation:popIn .28s cubic-bezier(.2,.9,.3,1.2);
}
.modal h3{font-size:17px;font-weight:800;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}

/* ============ 日历 ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-wd{text-align:center;font-size:11.5px;font-weight:700;color:var(--text-light);padding:6px 0;}
.cal-day{
  position:relative;aspect-ratio:1/1;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;cursor:pointer;
  border:1.5px solid transparent;transition:.18s;
}
.cal-day:hover{background:var(--primary-soft);}
.cal-day.empty{visibility:hidden;cursor:default;}
.cal-day.today{border-color:var(--primary);color:var(--primary);}
.cal-day.selected{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;}
.dot{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;}
.dot.repay{left:7px;background:#22c55e;}
.dot.add{right:7px;background:#ef4444;}
.cal-legend{display:flex;gap:18px;justify-content:center;margin-top:14px;font-size:12px;color:var(--text-light);}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.day-detail{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
.day-detail h4{font-size:13.5px;font-weight:800;margin-bottom:10px;}
.day-item{
  display:flex;justify-content:space-between;gap:10px;font-size:13px;
  padding:7px 0;border-bottom:1px dashed var(--border);
}
.day-item:last-child{border-bottom:none;}

/* ============ 报表 ============ */
.report-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;
}
.report-center{display:flex;flex-direction:column;align-items:center;gap:9px;flex:1;}
.report-range{font-size:14px;font-weight:800;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{
  background:var(--card);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;text-align:center;
}
.stat-num{font-size:30px;font-weight:900;color:var(--primary);line-height:1.1;}
.stat-num.red{color:var(--danger);}
.stat-num.green{color:var(--success);}
.stat-num.amber{color:var(--warn);}
.stat-label{font-size:12px;color:var(--text-light);margin-top:7px;font-weight:600;}
.board-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px dashed var(--border);
}
.board-row:last-child{border-bottom:none;}
.board-row .t{font-size:13.5px;font-weight:600;}
.board-row .v{font-size:19px;font-weight:900;}

/* ============ Toast ============ */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{
  padding:13px 20px;border-radius:14px;color:#fff;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 28px rgba(0,0,0,.18);animation:slideIn .3s ease;cursor:pointer;max-width:340px;
}
.toast.success{background:linear-gradient(135deg,#35c4ad,#5adcc4);}
.toast.error{background:linear-gradient(135deg,#ef4444,#f87171);}
.toast.info{background:linear-gradient(135deg,#3b82f6,#60a5fa);}
@keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

/* ============ 隐私弹窗 ============ */
.privacy-list{font-size:13.5px;line-height:1.95;color:var(--text-light);}
.privacy-list li{margin-bottom:9px;list-style:none;padding-left:16px;position:relative;}
.privacy-list li::before{content:'·';position:absolute;left:2px;color:var(--primary);font-weight:900;font-size:18px;line-height:1.4;}
.privacy-list .warn{color:var(--danger);font-weight:800;}

/* ============ 响应式 ============ */
@media (max-width:820px){
  .sidebar{box-shadow:6px 0 40px rgba(0,0,0,.18);}

/* Pixel diary skin — self-contained, no external fonts or images. */
:root{--bg-grad:#e5def2;--card:#fff6e6;--card-2:#f5e5d3;--text:#513d5d;--text-light:#806d87;--border:#6a5076;--primary:#9160a5;--primary-2:#b986bd;--primary-soft:#ead9ef;--danger:#bd526e;--success:#47806c;--warn:#ac782a;--shadow:5px 5px 0 #bba7c5;--radius:3px;--paper:#fffaf0;--pink:#efb6ce;--mint:#b7d9ca;--grid:rgba(255,255,255,.55)}
[data-theme="dark"]{--bg-grad:#302739;--card:#46364f;--card-2:#584360;--text:#f8ead9;--text-light:#cdb9d5;--border:#b58fc1;--primary:#d4a2dc;--primary-2:#a974b7;--primary-soft:#61466e;--shadow:5px 5px 0 #211a29;--paper:#3b2e44;--pink:#855476;--mint:#416858;--grid:rgba(214,183,230,.06);--danger:#f39ab0;--success:#a2d4bc;--warn:#ecc37c}
body{background-color:var(--bg-grad);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;line-height:1.6}
body::before,body::after{display:none}
.sidebar{background:var(--card-2);border-right:3px solid var(--border);box-shadow:5px 0 0 #6a507619;padding:82px 16px 22px;backdrop-filter:none}
.brand{color:var(--text);font-size:15px;padding:0 6px 24px;letter-spacing:1px}
.brand::after{content:'MY LITTLE DIARY / 01';display:block;font:10px/2.5 Consolas,monospace;letter-spacing:1px;color:var(--text-light)}
.nav{gap:12px}.nav-item{border:2px solid transparent;border-radius:2px;padding:11px 13px;color:var(--text);transition:transform .15s}
.nav-item.active{background:var(--pink);color:var(--text);border-color:var(--border);box-shadow:3px 3px 0 var(--border)}
.nav-item:hover{transform:translateX(2px)}.nav-item .ico{font-family:Consolas,monospace;color:var(--primary);font-weight:900}
.sidebar-foot{border-top:2px dashed var(--border)}
.main{padding:34px 40px 70px;max-width:1600px}
.page-title{border-bottom:2px dashed var(--border);padding:8px 0 18px;font-size:22px;letter-spacing:1px}
.card,.home-card,.entry-card,.record-card,.stat-box,.report-header,.modal,.panel{background:var(--card);border:2px solid var(--border);border-radius:3px;box-shadow:var(--shadow);backdrop-filter:none;-webkit-backdrop-filter:none}
.card:hover,.home-card:hover,.entry-card:hover,.record-card:hover{box-shadow:6px 7px 0 var(--border);transform:translateY(-2px)}
.btn,.icon-btn,.hamburger,.theme-toggle,.cal-btn,.close-btn,.chip,.segmented{border:2px solid var(--border);border-radius:2px;background:var(--paper);color:var(--text);box-shadow:3px 3px 0 var(--border);backdrop-filter:none;-webkit-backdrop-filter:none;transition:transform .12s,box-shadow .12s}
.btn:hover,.icon-btn:hover,.cal-btn:hover{filter:none;transform:translateY(-2px);background:var(--primary-soft)}
.btn:active,.icon-btn:active,.cal-btn:active{transform:translate(3px,3px);box-shadow:none}
.btn-primary,.icon-btn.active,.chip.active,.segmented button.active,.cal-day.selected{background:var(--primary);color:var(--paper);border-color:var(--border);box-shadow:3px 3px 0 var(--border)}
.btn-danger,.btn-add{background:var(--pink);color:var(--text)}.btn-repay{background:var(--mint);color:var(--text)}
.hamburger{top:20px;left:20px;width:40px;height:38px;font-size:20px}
.theme-toggle{font-size:12px;padding:10px;box-shadow:2px 2px 0 var(--border)}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--paper);border:2px solid var(--border);border-radius:2px;box-shadow:inset 3px 3px 0 #6a507613;backdrop-filter:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:3px}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:5px}
.chip{padding:5px 15px;margin-bottom:3px}.segmented{box-shadow:none}.segmented button{border-radius:0}.segmented button.active{box-shadow:none}
.entry-tag,.type-badge,.cal-day,.toast{border-radius:2px}.entry-tag,.type-badge{border:1px solid var(--border)}
.entry-qty,.big-num,.stat-num{font-family:Consolas,'Courier New',monospace;letter-spacing:2px}
.home-grid{max-width:1000px;gap:24px}.home-card{padding:0 24px 24px;min-height:230px;overflow:hidden}
.home-card-head{margin:0 -24px 22px;padding:12px 20px;background:var(--pink);border-bottom:2px solid var(--border)}
.home-card:nth-child(2) .home-card-head{background:var(--mint)}
.home-card-head h3{font-size:14px}.home-card-head .arrow{border:1px solid var(--border);padding:0 6px;color:var(--text);background:var(--paper)}
.home-cal-wrap{max-width:1000px;margin:0 auto 26px;display:flex;justify-content:flex-end}.cal-btn{width:48px;height:44px;font-size:22px;background:var(--pink)}
.home-links{margin-top:32px}.home-links .btn{border-radius:2px;font-size:12px}
.panel-head{background:var(--pink);border-bottom:2px solid var(--border)}.panel-foot{border-top:2px dashed var(--border)}
.modal h3{padding-bottom:12px;border-bottom:2px dashed var(--border)}
.overlay,.modal-overlay{background:#30213d80;backdrop-filter:none}
.toast{border:2px solid var(--border);box-shadow:4px 4px 0 var(--border)}.toast.success{background:#568874}.toast.error{background:#b55474}.toast.info{background:#9160a5}
[data-theme="dark"] :is(.btn-outline,.icon-btn,.chip,.close-btn,input,select,textarea,.segmented){background:var(--paper)}
[data-theme="dark"] :is(.chip.active,.icon-btn.active){background:var(--primary);color:#302739}
.diary-hero{max-width:1000px;margin:10px auto 28px;border:3px solid var(--border);background:var(--card);box-shadow:6px 6px 0 var(--border);position:relative}
.hero-bar{display:flex;justify-content:space-between;gap:12px;background:var(--primary-soft);border-bottom:2px solid var(--border);padding:7px 16px;font:11px/1.7 Consolas,monospace;letter-spacing:2px}
.hero-content{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:32px 32px 28px;overflow:hidden}
.hero-eyebrow{font:11px/1.5 Consolas,monospace;letter-spacing:3px;color:var(--primary);margin-bottom:12px}
.hero-content h1{font-size:30px;letter-spacing:3px;line-height:1.5;margin-bottom:12px}.hero-content p{font-size:13px;color:var(--text-light);line-height:1.9}
.pixel-scene{width:260px;max-width:42%;flex-shrink:0;image-rendering:pixelated;shape-rendering:crispEdges}
@media(max-width:1100px){.main{padding:28px 24px 60px}.hero-content{padding:24px}.hero-content h1{font-size:25px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.entries = Array.isArray(d.entries)?d.entries:[];
      state.records = Array.isArray(d.records)?d.records:[];
      state.drafts  = Array.isArray(d.drafts)?d.drafts:[];
      state.tags    = Array.isArray(d.tags)?d.tags:[];
      state.theme   = d.theme==='dark'?'dark':'light';
    }
  }catch(e){ console.warn('数据读取失败', e); }
  state.entries.forEach(e=>{ if(!Array.isArray(e.history)) e.history=[]; });
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; }
  catch(e){ showToast('保存失败：本地存储空间不足','error'); return false; }
}

/* ============================================================
   日历
============================================================ */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-11
let calSelected = null;

function openCalendar(){
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calSelected = null;
  document.getElementById('calendarModal').style.display='flex';
  renderCalendar();
}
function closeCalendar(){
  document.getElementById('calendarModal').style.display='none';
}
function calMove(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  if(calMonth > 11){ calMonth = 0; calYear++; }
  calSelected = null;
  renderCalendar();
  document.getElementById('dayDetail').innerHTML = '';
}
function buildDayMap(){
  const map = {};
  state.entries.forEach(e=>{
    (e.history||[]).forEach(h=>{
      if(!map[h.date]) map[h.date] = {repay:false, add:false, items:[]};
      if(h.type==='repay') map[h.date].repay = true;
      if(h.type==='add')   map[h.date].add   = true;
      map[h.date].items.push({title:e.title, type:h.type, amount:h.amount, unit:h.unit||e.unit||'次', note:h.note||''});
    });
  });
  return map;
}
function renderCalendar(){
  const map = buildDayMap();
  document.getElementById('calMonthLabel').textContent = `${calYear} 年 ${calMonth+1} 月`;

  const first = new Date(calYear, calMonth, 1).getDay();
  const days  = new Date(calYear, calMonth+1, 0).getDate();
  const today = todayStr();

  let html = '';
  ['日','一','二','三','四','五','六'].forEach(w=> html += `<div class="cal-wd">${w}</div>`);
  for(let i=0;i<first;i++) html += `<div class="cal-day empty"></div>`;

  for(let d=1; d<=days; d++){
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info = map[ds];
    const cls = ['cal-day'];
    if(ds === today) cls.push('today');
    if(ds === calSelected) cls.push('selected');
    html += `<div class="${cls.join(' ')}" onclick="selectDay('${ds}')">
      <span>${d}</span>
      ${info && info.repay ? '<span class="dot repay"></span>' : ''}
      ${info && info.add   ? '<span class="dot add"></span>'   : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
function selectDay(ds){
  calSelected = ds;
  renderCalendar();
  const map = buildDayMap();
  const info = map[ds];
  const box = document.getElementById('dayDetail');
  if(!info || info.items.length === 0){
    box.innerHTML = `<h4>${ds}</h4><div class="empty-mini">这一天没有记账记录</div>`;
    return;
  }
  let html = `<h4>${ds} 的记账记录</h4>`;
  info.items.forEach(it=>{
    const isRepay = it.type === 'repay';
    html += `<div class="day-item">
      <span>${esc(it.title)}</span>
      <span style="font-weight:800;color:${isRepay?'#16a34a':'#ef4444'};">
        ${isRepay?'还债 -':it.type==='add'?'加债 +':'余额调整 '}${it.amount} ${esc(it.unit)}${it.note?' · '+esc(it.note):''}
      </span>
    </div>`;
  });
  box.innerHTML = html;
}

function openEntryModal(id){
  editingEntryId = id || null;
  const modal = document.getElementById('entryModal');

  const saveBtn = document.getElementById('entrySaveBtn');
  const delBtn  = document.getElementById('entryDeleteBtn');

  const tagSel = document.getElementById('entryTag');
  tagSel.innerHTML = `<option value="__default__">默认</option>` +
    state.tags.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('') +
    `<option value="__new__">+ 新建标签…</option>`;

  document.getElementById('newTagInput').style.display = 'none';
  document.getElementById('newTagInput').value = '';

  if(id){
    const e = state.entries.find(x=>x.id===id);
    if(!e) return;
    titleEl.textContent = '编辑账目';
    saveBtn.textContent = '保存修改';
    delBtn.style.display = 'inline-flex';
    document.getElementById('entryTitle').value = e.title || '';
    document.getElementById('entryDesc').value = e.desc || '';
    document.getElementById('entryQty').value = e.quantity || 1;
    tagSel.value = e.tag ? e.tag : '__default__';
    if(e.tag && !state.tags.includes(e.tag)){
      tagSel.insertAdjacentHTML('beforeend', `<option value="${esc(e.tag)}">${esc(e.tag)}</option>`);
      tagSel.value = e.tag;
    }
    document.getElementById('entryInterest').value = e.interest === 'yes' ? 'yes' : 'no';
    document.getElementById('interestGroup').style.display = e.interest === 'yes' ? 'block' : 'none';
    document.getElementById('entryInterestText').value = e.interestText || '';
  }else{
    titleEl.textContent = '新建账目';
    saveBtn.textContent = '新建账目';
    delBtn.style.display = 'none';
    document.getElementById('entryTitle').value = '';
    document.getElementById('entryDesc').value = '';
    document.getElementById('entryQty').value = 1;
    tagSel.value = '__default__';
    document.getElementById('entryInterest').value = 'no';
    document.getElementById('interestGroup').style.display = 'none';
    document.getElementById('entryInterestText').value = '';
  }

  modal.style.display = 'flex';
  setTimeout(()=> document.getElementById('entryTitle').focus(), 80);
}
function closeEntryModal(){
  document.getElementById('entryModal').style.display = 'none';
  editingEntryId = null;
}
function onTagSelectChange(){
  const v = document.getElementById('entryTag').value;
  document.getElementById('newTagInput').style.display = (v === '__new__') ? 'block' : 'none';
  if(v === '__new__') setTimeout(()=> document.getElementById('newTagInput').focus(), 50);
}
function onInterestChange(){
  const v = document.getElementById('entryInterest').value;
  document.getElementById('interestGroup').style.display = (v === 'yes') ? 'block' : 'none';
  if(v === 'yes') setTimeout(()=> document.getElementById('entryInterestText').focus(), 50);
}

function saveEntry(){
  const title = document.getElementById('entryTitle').value.trim();
  const desc  = document.getElementById('entryDesc').value.trim();
  const qty   = parseInt(document.getElementById('entryQty').value);
  const interest = document.getElementById('entryInterest').value;
  const interestText = document.getElementById('entryInterestText').value.trim();

  if(!title){ showToast('请输入账目标题', 'error'); return; }
  if(!Number.isFinite(qty) || qty < 0 || qty > 9999){ showToast('账目数目必须在 0 ~ 9999 之间', 'error'); return; }
  if(interest === 'yes' && !interestText){ showToast('请填写利息内容', 'error'); return; }

  // 标签
  let tag = null;
  const tagSelVal = document.getElementById('entryTag').value;
  if(tagSelVal === '__new__'){
    const nt = document.getElementById('newTagInput').value.trim();
    if(!nt){ showToast('请输入新标签名', 'error'); return; }
    if([...nt].length > 4){ showToast('标签名不能超过 4 个字符', 'error'); return; }
    tag = nt;
    if(!state.tags.includes(nt)) state.tags.push(nt);
  }else if(tagSelVal !== '__default__'){
    tag = tagSelVal;
  }

  if(editingEntryId){
    const e = state.entries.find(x=>x.id===editingEntryId);
    if(e){
      e.title = title; e.desc = desc; e.quantity = qty;
      e.tag = tag; e.interest = interest;
      e.interestText = interest === 'yes' ? interestText : '';
      if(!saveState()) return;
      showToast('账目已更新');
    }
  }else{
    state.entries.push({
      id: uid(), title, desc, quantity: qty, tag,
      interest, interestText: interest === 'yes' ? interestText : '',
      createdAt: Date.now(), history: []
    });
    if(!saveState()) return;
    showToast('账目创建成功');
  }
  closeEntryModal();
  renderLedger();
  renderHome();
}
function deleteEntryFromModal(){
  if(!editingEntryId) return;
  deleteEntry(editingEntryId, true);
}
function deleteEntry(id, fromModal){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  if(!confirm(`确定删除账目「${e.title}」吗？相关记录也会一并删除。`)) return;
  state.entries = state.entries.filter(x=>x.id!==id);
  if(!saveState()) return;
  showToast('账目已删除');
  if(fromModal) closeEntryModal();
  renderLedger();
  renderHome();
}

let payEntryId = null, payType = 'repay';
function openPayModal(id, type){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  payEntryId = id; payType = type;
  document.getElementById('payModalTitle').textContent = type === 'repay' ? '今日还债' : '又要多挨';
  document.getElementById('payModalHint').textContent =
    `账目「${e.title}」当前数目：${e.quantity}`;
  document.getElementById('payAmount').value = 1;
  document.getElementById('payModal').style.display = 'flex';
  setTimeout(()=> document.getElementById('payAmount').focus(), 80);
}
function closePayModal(){
  document.getElementById('payModal').style.display = 'none';
  payEntryId = null;
}
function savePay(){
  const e = state.entries.find(x=>x.id === payEntryId);
  if(!e) return;
  const amt = parseInt(document.getElementById('payAmount').value);
  if(!Number.isFinite(amt) || amt < 1 || amt > 9999){
    showToast('数目必须在 1 ~ 9999 之间', 'error'); return;
  }
  if(payType === 'repay'){
    e.quantity = Math.max(0, e.quantity - amt);
  }else{
    e.quantity = e.quantity + amt;
  }
  e.history.push({
    id: uid(), type: payType, amount: amt,
    date: todayStr(), ts: Date.now()
  });
  saveState();
  closePayModal();
  renderLedger();
  renderHome();
  showToast(payType === 'repay' ? `已还债 ${amt}` : `已加债 ${amt}`, 'success');
}

    document.getElementById('recTitle').value.trim() ||
    document.getElementById('recContent').value.trim();

    if(confirm('是否保存为草稿？\n（点「确定」保存草稿，点「取消」直接关闭）')){
      saveDraft(true);

  }

function setRecType(t, el){
  recType = t;
  document.querySelectorAll('#recTypeSeg button').forEach(b=>{
    b.classList.toggle('active', b.dataset.type === t);
  });
}
function collectRecord(){
  return {
    title: document.getElementById('recTitle').value.trim(),
    date:  document.getElementById('recDate').value || todayStr(),
    type:  recType,
    content: document.getElementById('recContent').value
  };
}
function submitRecord(){
  const data = collectRecord();
  if(editingRecId){
    const r = state.records.find(x=>x.id===editingRecId);
    if(r){
      Object.assign(r, data, {updatedAt: Date.now()});
    }
  }else{
    state.records.push({
      id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now()
    });
  }
  if(!saveState()) return;
  showToast('记录已保存');
  document.getElementById('editorOverlay').classList.remove('show');
  editingRecId = null;
  renderCircle();
  renderHome();
}
function saveDraft(silent){
  const data = collectRecord();
  if(!data.title && !data.content && !silent){
    showToast('空内容无法保存草稿', 'error'); return;
  }
  state.drafts.push({ id: uid(), ...data, savedAt: Date.now() });
  saveState();
  if(!silent) showToast('已保存到草稿箱');
  if(!silent){
    document.getElementById('editorOverlay').classList.remove('show');
    editingRecId = null;
  }
}

/* -------- 导出 JPG -------- */
function exportJpg(r){
  const W = 760, PAD = 48;
  const maxW = W - PAD * 2;
  const LINE_H = 32;

  const mc = document.createElement('canvas').getContext('2d');
  const titleFont = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  const metaFont  = '16px "PingFang SC","Microsoft YaHei",sans-serif';
  const bodyFont  = '18px "PingFang SC","Microsoft YaHei",sans-serif';

  // 标题折行
  mc.font = titleFont;
  const titleLines = [];
  let tl = '';
  for(const ch of (r.title || '无标题')){
    if(mc.measureText(tl + ch).width > maxW){ titleLines.push(tl); tl = ch; }
    else tl += ch;
  }
  titleLines.push(tl);

  // 正文折行
  mc.font = bodyFont;
  const bodyLines = [];
  (r.content || '').split('\n').forEach(para=>{
    if(para === ''){ bodyLines.push(''); return; }
    let line = '';
    for(const ch of para){
      if(mc.measureText(line + ch).width > maxW){ bodyLines.push(line); line = ch; }
      else line += ch;
    }
    bodyLines.push(line);
  });
  if(bodyLines.length === 0) bodyLines.push('');

  const H = PAD + 34 + titleLines.length * 44 + 6 + 24 + 34 + bodyLines.length * LINE_H + PAD;

  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // 背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 顶部渐变条
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#35c4ad');
  grad.addColorStop(1, '#5adcc4');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 8);

  ctx.textBaseline = 'alphabetic';
  let y = PAD + 34;

  ctx.fillStyle = '#1f2d33';
  ctx.font = titleFont;
  titleLines.forEach(l=>{ ctx.fillText(l, PAD, y); y += 44; });

  y += 6;
  ctx.fillStyle = '#8a9ba1';
  ctx.font = metaFont;
  ctx.fillText(`${r.date} · ${r.type === 'diary' ? '日记' : '实践记录'}`, PAD, y);
  y += 24;

  ctx.strokeStyle = '#e3efec';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD, y);
  ctx.lineTo(W - PAD, y);
  ctx.stroke();
  y += 34;

  ctx.fillStyle = '#2c3a40';
  ctx.font = bodyFont;
  bodyLines.forEach(l=>{ ctx.fillText(l, PAD, y); y += LINE_H; });

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(r.title || '记录').replace(/[\\/:*?"<>|]/g,'_')}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('已导出为 JPG 图片');
  }, 'image/jpeg', 0.92);
}

let reportPeriod = 'week';
let reportAnchor = new Date();

function setPeriod(p, el){
  reportPeriod = p;
  reportAnchor = new Date();          // 切换周期时回到当前
  document.querySelectorAll('#periodSeg button').forEach(b=>{
    b.classList.toggle('active', b.dataset.p === p);
  });
  renderPersonal();

// 当前锚点范围是否还能继续往后（往前 = 更靠近现在）
function canGoNextRange(){
  const { start } = getRange(reportPeriod, reportAnchor);
  const { start: curStart } = getRange(reportPeriod, new Date());
  return start < curStart;
}

function shiftRange(delta){
  if(delta > 0 && !canGoNextRange()) return;   // 已经在最新期限，禁止再往后
  if(reportPeriod === 'week'){
    reportAnchor.setDate(reportAnchor.getDate() + delta * 7);
  }else if(reportPeriod === 'month'){
    reportAnchor.setMonth(reportAnchor.getMonth() + delta);
  }else{
    reportAnchor.setFullYear(reportAnchor.getFullYear() + delta);
  }
  renderPersonal();
}
function getRange(period, anchor){
  const d = new Date(anchor);
  if(period === 'week'){
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    return { start, end };
  }
  if(period === 'month'){
    return {
      start: new Date(d.getFullYear(), d.getMonth(), 1),
      end:   new Date(d.getFullYear(), d.getMonth() + 1, 0)
    };
  }
  return {
    start: new Date(d.getFullYear(), 0, 1),
    end:   new Date(d.getFullYear(), 11, 31)
  };
}

function renderPersonal(){
  const { start, end } = getRange(reportPeriod, reportAnchor);
  const s = fmtDate(start), e = fmtDate(end);

  // 标题
  let label;
  if(reportPeriod === 'week') label = `${s} ~ ${e}`;
  else if(reportPeriod === 'month') label = `${start.getFullYear()} 年 ${start.getMonth()+1} 月`;
  else label = `${start.getFullYear()} 年`;
  document.getElementById('rangeLabel').textContent = label;

  // 统计
  let repayTotal = 0, addTotal = 0;
  const dayEntryMap = {}; // date|entryId -> {title, repay, add}

  state.entries.forEach(entry=>{
    (entry.history||[]).forEach(h=>{
      if(h.date < s || h.date > e) return;
      if(h.type === 'repay') repayTotal += h.amount;
      else addTotal += h.amount;

      const key = h.date + '|' + entry.id;
      if(!dayEntryMap[key]) dayEntryMap[key] = { title: entry.title, repay: 0, add: 0 };
      if(h.type === 'repay') dayEntryMap[key].repay += h.amount;
      else dayEntryMap[key].add += h.amount;
    });
  });

  const recsInRange = state.records.filter(r=> r.date >= s && r.date <= e);
  const diaryCount    = recsInRange.filter(r=> r.type === 'diary').length;
  const practiceCount = recsInRange.filter(r=> r.type === 'practice').length;

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-box"><div class="stat-num green">${repayTotal}</div><div class="stat-label">还债数目</div></div>
    <div class="stat-box"><div class="stat-num red">${addTotal}</div><div class="stat-label">加债数目</div></div>
    <div class="stat-box"><div class="stat-num amber">${diaryCount}</div><div class="stat-label">日记记录</div></div>
    <div class="stat-box"><div class="stat-num">${practiceCount}</div><div class="stat-label">实践次数</div></div>
  `;

  // 长板数据
  let bestRepay = null, bestAdd = null;
  Object.values(dayEntryMap).forEach(v=>{
    if(v.repay > 0 && (!bestRepay || v.repay > bestRepay.val)) bestRepay = { title: v.title, val: v.repay };
    if(v.add   > 0 && (!bestAdd   || v.add   > bestAdd.val))   bestAdd   = { title: v.title, val: v.add };
  });

  document.getElementById('boardData').innerHTML = `
    <div class="board-row">
      <span class="t">单日最高还债</span>
      <span class="v" style="color:#16a34a;">
        ${bestRepay ? `${esc(bestRepay.title)} - ${bestRepay.val}` : '—'}
      </span>
    </div>
    <div class="board-row">
      <span class="t">单日最高加债</span>
      <span class="v" style="color:#ef4444;">
        ${bestAdd ? `${esc(bestAdd.title)} - ${bestAdd.val}` : '—'}
      </span>
    </div>
  `;
  // 同步“下一期限”按钮的可用状态
  const nextBtn = document.getElementById('nextRangeBtn');
  if(nextBtn){
    const can = canGoNextRange();
    nextBtn.disabled = !can;
    nextBtn.style.opacity = can ? '' : '.35';
    nextBtn.style.cursor = can ? 'pointer' : 'not-allowed';
  }
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!d || typeof d !== 'object') throw new Error('格式错误');
      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state.entries = Array.isArray(d.entries) ? d.entries : [];
      state.records = Array.isArray(d.records) ? d.records : [];
      state.drafts  = Array.isArray(d.drafts)  ? d.drafts  : [];
      state.tags    = Array.isArray(d.tags)    ? d.tags    : [];
      state.entries.forEach(x=>{ if(!Array.isArray(x.history)) x.history = []; });
      saveState();

      // 每个渲染独立 try-catch，任何一步失败都不影响整体成功提示
      try { renderHome(); }     catch(err){ console.error('renderHome 出错:', err); }
      try { renderLedger(); }   catch(err){ console.error('renderLedger 出错:', err); }
      try { renderCircle(); }   catch(err){ console.error('renderCircle 出错:', err); }
      try { renderPersonal(); } catch(err){ console.error('renderPersonal 出错:', err); }

      showToast('数据导入成功');
    }catch(err){
      console.error('导入出错:', err);
      showToast('导入失败：' + (err.message || '未知错误'), 'error');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

  e.history.push({id:uid(),type,amount:amt,before:balance,after:e.quantity,unit:e.unit||'次',note:$('payNote').value.trim(),date:todayStr(),ts:Date.now()});
  if(!saveState())return;closePayModal();remember(before,type==='repay'?'还债':'加债');refreshAll();showToast(`已${type==='repay'?'还债':'加债'} ${amt} ${e.unit||'次'}`);
};
const originalRenderLedger=renderLedger;
renderLedger=function(){originalRenderLedger();let list=[...state.entries];if(ledgerTag==='__default__')list=list.filter(e=>!e.tag);else if(ledgerTag!=='all')list=list.filter(e=>e.tag===ledgerTag);if(ledgerSearch)list=list.filter(e=>[e.title,e.desc,e.tag].some(v=>(v||'').toLowerCase().includes(ledgerSearch.toLowerCase())));list.sort((a,b)=>b.createdAt-a.createdAt);document.querySelectorAll('#ledgerList .entry-card').forEach((card,i)=>{const e=list[i];card.querySelector('.entry-qty').append(document.createTextNode(' '+(e.unit||'次')));const btn=document.createElement('button');btn.className='btn btn-sm btn-outline';btn.textContent='明细';btn.onclick=()=>openHistory(e.id);card.querySelector('.entry-actions').append(btn)})};
function historyRows(items){return items.length?items.map(({entry,h})=>`<div class="detail-row"><strong>${esc(entry.title)}</strong> · ${h.type==='repay'?'还债 −':h.type==='add'?'加债 ＋':'余额调整 '}${h.amount} ${esc(h.unit||entry.unit||'次')}<small>${esc(h.date)}${h.ts?' '+new Date(h.ts).toLocaleTimeString('zh-CN'):''}${h.before!==undefined?` · ${h.before} → ${h.after}`:''}</small>${h.note?`<div>${esc(h.note)}</div>`:''}</div>`).join(''):'<p class="feature-hint">暂无变动明细。</p>'}
function openHistory(id){const entry=state.entries.find(e=>e.id===id);if(entry)featureModal(entry.title+' · 账目明细',`<p>当前余额：${entry.quantity} ${esc(entry.unit||'次')}</p>`+historyRows([...entry.history].sort((a,b)=>(b.ts||0)-(a.ts||0)).map(h=>({entry,h}))))}
// High priority: backup status and validated import preview.
let backupMeta={};try{backupMeta=JSON.parse(localStorage.getItem(LS_KEY+'_backupMeta')||'{}')}catch{}
document.querySelector('#page-personal .card:last-child .form-hint').id='backupStatus';
const backupAlert=document.createElement('div');backupAlert.className='backup-alert';backupAlert.id='backupAlert';document.querySelector('.diary-hero').after(backupAlert);
function renderBackupStatus(){const msg=backupMeta.exportedAt?'上次发起导出：'+new Date(backupMeta.exportedAt).toLocaleString('zh-CN'):'尚未导出过备份';$('backupStatus').textContent=msg+'。数据仅存在此浏览器，请确认备份文件已下载。';const due=(state.entries.length+state.records.length+state.drafts.length)>0&&(!backupMeta.exportedAt||Date.now()-backupMeta.exportedAt>7*86400000);backupAlert.hidden=!due;backupAlert.innerHTML=`✧ ${esc(msg)}，建议保存一份备份。 <button class="btn btn-sm btn-outline" onclick="exportData()">导出备份</button>`}
const originalExportData=exportData;
exportData=function(){originalExportData();backupMeta.exportedAt=Date.now();try{localStorage.setItem(LS_KEY+'_backupMeta',JSON.stringify(backupMeta))}catch{}renderBackupStatus()};
function validateBackup(d){
  if(!d||typeof d!=='object'||!dataKeys.every(k=>Array.isArray(d[k])))throw Error('备份需包含账目、记录、草稿和标签数组');
  for(const key of ['entries','records','drafts']){const ids=new Set();for(const x of d[key]){if(!x||typeof x!=='object'||typeof x.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(x.id)||ids.has(x.id))throw Error('记录 ID 无效或重复');ids.add(x.id);for(const field of ['title','content','desc','date','unit','noteTemplate'])if(x[field]!==undefined&&typeof x[field]!=='string')throw Error('文本字段格式错误');if(key==='entries'){if(!Number.isSafeInteger(x.quantity)||x.quantity<0)throw Error('账目余额无效');if(x.history!==undefined&&!Array.isArray(x.history))throw Error('变动明细无效');for(const h of x.history||[])if(!h||!['repay','add','adjust'].includes(h.type)||!Number.isSafeInteger(h.amount)||h.amount<0||typeof h.date!=='string')throw Error('明细格式错误');}else if(!['diary','practice'].includes(x.type)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||''))throw Error('记录类型或日期无效')}}
  if(d.tags.some(t=>typeof t!=='string'))throw Error('标签格式错误');return copyData(d);
}
importData=function(ev){const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>10*1024*1024){showToast('备份文件超过 10MB','error');return}const reader=new FileReader();reader.onload=()=>{try{const d=validateBackup(JSON.parse(reader.result));const ov=featureModal('导入预览',`<p>账目 ${d.entries.length} 条 · 记录 ${d.records.length} 篇 · 草稿 ${d.drafts.length} 篇</p><p class="feature-hint">合并：保留现有数据，相同 ID 保留本地版本。替换：使用备份中的全部记录。导入前会保留一份本地恢复副本。</p><div class="feature-row"><button class="btn btn-primary" data-merge>合并导入</button><button class="btn btn-outline" data-replace>替换导入</button></div>`);const apply=merge=>{const before=snapshot();try{localStorage.setItem(LS_KEY+'_beforeImport',JSON.stringify(before))}catch{showToast('无法保存导入前副本，请先释放存储空间','error');return}for(const k of dataKeys){if(!merge)state[k]=d[k];else if(k==='tags')state.tags=[...new Set([...state.tags,...d.tags])];else{const ids=new Set(state[k].map(x=>x.id));state[k].push(...d[k].filter(x=>!ids.has(x.id)))}}state.entries.forEach(e=>{e.history ||= []});if(!saveState()){Object.assign(state,before);return}remember(before,'导入数据');ov.remove();refreshAll();showToast('导入完成，可使用撤销恢复')};ov.querySelector('[data-merge]').onclick=()=>apply(true);ov.querySelector('[data-replace]').onclick=()=>apply(false)}catch(err){showToast('导入失败：'+err.message,'error')}};reader.readAsText(file)};
const recovery=document.createElement('button');recovery.className='btn btn-outline';recovery.textContent='恢复导入前副本';recovery.onclick=()=>{try{const raw=localStorage.getItem(LS_KEY+'_beforeImport');if(!raw){showToast('暂无导入前副本','info');return}const d=validateBackup(JSON.parse(raw));const ov=featureModal('恢复导入前副本',`<p>将恢复 ${d.entries.length} 条账目、${d.records.length} 篇记录、${d.drafts.length} 篇草稿。</p><button class="btn btn-primary" data-restore>确认恢复</button>`);ov.querySelector('[data-restore]').onclick=()=>{const before=snapshot();dataKeys.forEach(k=>state[k]=d[k]);if(!saveState()){Object.assign(state,before);return}remember(before,'恢复副本');refreshAll();ov.remove();showToast('已恢复导入前数据')}}catch{showToast('恢复副本格式错误','error')}};$('importFile').parentElement.append(recovery);
// Medium priority: record tags, date filters and durable autosave drafts.
$('circleSearch').insertAdjacentHTML('afterend',`<div class="feature-row"><input type="date" id="circleFrom" aria-label="开始日期" onchange="renderCircle()"><span>至</span><input type="date" id="circleTo" aria-label="结束日期" onchange="renderCircle()"><input type="text" id="circleTag" aria-label="筛选记录标签" placeholder="筛选标签" oninput="renderCircle()"><button class="btn btn-sm btn-outline" onclick="['circleFrom','circleTo','circleTag','circleSearch'].forEach(id=>document.getElementById(id).value='');renderCircle()">重置</button></div>`);
$('recTitle').closest('.form-group').insertAdjacentHTML('afterend',`<div class="form-group"><label for="recTags">记录标签</label><input id="recTags" type="text" maxlength="100" placeholder="用逗号分隔，如：日常、心情"></div><p class="feature-hint" id="autoSaveStatus" role="status">填写后自动保存草稿</p>`);
const originalCollectRecord=collectRecord;
collectRecord=function(){return {...originalCollectRecord(),tags:$('recTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).slice(0,10)}};
let activeDraftId=null,autoTimer=null;
const originalEditor=openEditor;
openEditor=function(record){activeDraftId=null;originalEditor(record);$('recTags').value=(record?.tags||[]).join('，');$('autoSaveStatus').textContent='填写后自动保存草稿'};
function persistDraft(){clearTimeout(autoTimer);if(!$('editorOverlay').classList.contains('show'))return;const d=collectRecord();if(!d.title&&!d.content&&!d.tags.length)return true;activeDraftId ||= uid();const draft={id:activeDraftId,...d,sourceId:editingRecId,savedAt:Date.now()},index=state.drafts.findIndex(x=>x.id===activeDraftId);if(index<0)state.drafts.push(draft);else state.drafts[index]=draft;if(saveState()){$('autoSaveStatus').textContent='✦ 草稿已自动保存 · '+new Date().toLocaleTimeString('zh-CN');return true}$('autoSaveStatus').textContent='保存失败，请保留此窗口并导出备份';return false}
$('editorOverlay').addEventListener('input',()=>{clearTimeout(autoTimer);$('autoSaveStatus').textContent='正在保存…';autoTimer=setTimeout(persistDraft,600)});
const originalSetType=setRecType;setRecType=function(...args){originalSetType(...args);if($('editorOverlay').classList.contains('show'))persistDraft()};
window.addEventListener('pagehide',persistDraft);document.addEventListener('visibilitychange',()=>{if(document.hidden)persistDraft()});
closeEditor=function(){if(persistDraft()===false)return;$('editorOverlay').classList.remove('show');editingRecId=null};
saveDraft=function(){if(persistDraft()===false)return;if(!activeDraftId){showToast('空内容无法保存草稿','error');return}$('editorOverlay').classList.remove('show');editingRecId=null;showToast('已保存到草稿箱')};
resumeDraft=function(id,btn){const d=state.drafts.find(x=>x.id===id);if(!d)return;btn.closest('.modal-overlay').remove();openEditor(d.sourceId?state.records.find(r=>r.id===d.sourceId):undefined);activeDraftId=d.id;$('recTitle').value=d.title||'';$('recDate').value=d.date;$('recContent').value=d.content||'';$('recTags').value=(d.tags||[]).join('，');originalSetType(d.type);$('autoSaveStatus').textContent='已恢复草稿，继续编辑会自动保存'};
const originalSubmit=submitRecord;
submitRecord=function(){clearTimeout(autoTimer);const before=snapshot();originalSubmit();if($('editorOverlay').classList.contains('show'))return;if(activeDraftId)state.drafts=state.drafts.filter(d=>d.id!==activeDraftId);activeDraftId=null;if(!saveState())return;remember(before,'保存记录');refreshAll()};
renderCircle=function(){const kw=$('circleSearch').value.trim().toLowerCase(),from=$('circleFrom').value,to=$('circleTo').value,tag=$('circleTag').value.trim().toLowerCase();if(from&&to&&from>to){$('circleList').innerHTML='<p class="feature-hint">开始日期不能晚于结束日期。</p>';return}const list=state.records.filter(r=>(circleFilter==='all'||r.type===circleFilter)&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!tag||(r.tags||[]).some(t=>t.toLowerCase().includes(tag)))&&(!kw||[r.title,r.content,...(r.tags||[])].some(s=>(s||'').toLowerCase().includes(kw)))).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);$('circleList').innerHTML=list.length?list.map(r=>`<div class="record-card"><div class="record-title">${esc(r.title||'无标题')} <span class="type-badge">${r.type==='diary'?'日记':'实践记录'}</span></div><div class="record-date">${esc(r.date)} · ${esc((r.tags||[]).join(' / '))}</div><div class="record-preview">${esc((r.content||'').slice(0,90))}</div><div class="feature-row"><button class="btn btn-sm btn-outline" data-view="${esc(r.id)}">查看</button><button class="btn btn-sm btn-danger" data-delete="${esc(r.id)}">删除</button></div></div>`).join(''):'<div class="card">没有符合条件的记录，试试调整筛选或新建一篇。</div>';$('circleList').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openViewer(b.dataset.view));$('circleList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const before=snapshot();state.records=state.records.filter(r=>r.id!==b.dataset.delete);saveState();remember(before,'删除记录');refreshAll();showToast('记录已删除，可撤销')})};
// Medium priority: statistics grouped by unit, with linked details and trends.
const originalPersonal=renderPersonal;
renderPersonal=function(){originalPersonal();const {start,end}=getRange(reportPeriod,reportAnchor),s=fmtDate(start),e=fmtDate(end);const items=state.entries.flatMap(entry=>(entry.history||[]).filter(h=>h.date>=s&&h.date<=e&&h.type!=='adjust').map(h=>({entry,h})));const groups=Object.create(null);for(const {entry,h} of items){const unit=h.unit||entry.unit||'次';groups[unit] ||= {add:0,repay:0};groups[unit][h.type]+=h.amount}const totals=type=>Object.entries(groups).map(([u,v])=>`${v[type]} ${esc(u)}`).join('<br>')||'0';const recs=state.records.filter(r=>r.date>=s&&r.date<=e);$('statGrid').innerHTML=`<button class="stat-box" onclick="reportDetails('repay')"><div class="stat-num green">${totals('repay')}</div><div class="stat-label">本期偿还 · 查看明细</div></button><button class="stat-box" onclick="reportDetails('add')"><div class="stat-num red">${totals('add')}</div><div class="stat-label">本期新增 · 查看明细</div></button><button class="stat-box" onclick="reportDetails('diary')"><div class="stat-num amber">${recs.filter(r=>r.type==='diary').length}</div><div class="stat-label">日记 · 查看明细</div></button><button class="stat-box" onclick="reportDetails('practice')"><div class="stat-num">${recs.filter(r=>r.type==='practice').length}</div><div class="stat-label">实践记录 · 查看明细</div></button>`;
  const dayGroups={};items.forEach(({entry,h})=>{const key=h.date+'|'+(h.unit||entry.unit||'次');dayGroups[key] ||= {date:h.date,unit:h.unit||entry.unit||'次',add:0,repay:0};dayGroups[key][h.type]+=h.amount});const rows=Object.values(dayGroups).sort((a,b)=>a.date.localeCompare(b.date));const max=Math.max(1,...rows.map(r=>r.add+r.repay));$('boardData').innerHTML=`<div class="feature-hint">本期净变化（新增 − 偿还）：${Object.entries(groups).map(([u,v])=>`${v.add-v.repay>0?'+':''}${v.add-v.repay} ${esc(u)}`).join(' · ')||'暂无变动'}。不同单位分别统计；直接编辑余额的调整记录不计入新增／偿还。</div>`+(rows.length?`<table class="trend-table"><caption>每日变动趋势</caption><thead><tr><th>日期</th><th>新增</th><th>偿还</th><th>变动量</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>+${r.add} ${esc(r.unit)}</td><td>−${r.repay} ${esc(r.unit)}</td><td><div class="trend-track" title="新增与偿还共 ${r.add+r.repay}"><div class="trend-fill" style="width:${(r.add+r.repay)/max*100}%"></div></div></td></tr>`).join('')}</tbody></table>`:'<p class="feature-hint">本期暂无账目变动。</p>');renderBackupStatus()};
document.querySelector('#boardData').previousElementSibling.textContent='✦ 本期净变化与趋势';
function reportDetails(type){const {start,end}=getRange(reportPeriod,reportAnchor),s=fmtDate(start),e=fmtDate(end);if(['diary','practice'].includes(type)){const recs=state.records.filter(r=>r.type===type&&r.date>=s&&r.date<=e);const ov=featureModal('本期记录',recs.map(r=>`<div class="detail-row"><button class="btn btn-sm btn-outline" data-rec="${esc(r.id)}">${esc(r.title||'无标题')}</button> ${esc(r.date)}</div>`).join('')||'本期暂无记录');ov.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{ov.remove();openViewer(b.dataset.rec)})}else featureModal('本期变动明细',historyRows(state.entries.flatMap(entry=>(entry.history||[]).filter(h=>h.type===type&&h.date>=s&&h.date<=e).map(h=>({entry,h}))).sort((a,b)=>(b.h.ts||0)-(a.h.ts||0))))}
// Persist failures are observable so autosave and imports never claim success.
const baseValidateBackup=validateBackup;
validateBackup=function(d){const clean=baseValidateBackup(d);for(const key of ['records','drafts'])for(const r of clean[key])if(r.tags!==undefined&&(!Array.isArray(r.tags)||r.tags.some(t=>typeof t!=='string')))throw Error('记录标签格式错误');for(const e of clean.entries){if(e.tag!==undefined&&e.tag!==null&&typeof e.tag!=='string')throw Error('账目标签格式错误');if(e.quickAmount!==undefined&&(!Number.isInteger(e.quickAmount)||e.quickAmount<1||e.quickAmount>9999))throw Error('常用数量格式错误');for(const h of e.history||[]){if(h.unit!==undefined&&typeof h.unit!=='string')throw Error('明细单位格式错误');if(h.note!==undefined&&typeof h.note!=='string')throw Error('明细备注格式错误')}}return clean};
saveState=function(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));return true}catch{try{const saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(saved)dataKeys.forEach(k=>state[k]=saved[k]||[])}catch{}showToast('保存失败：存储空间不足，请立即导出备份','error');return false}};
refreshAll();
</script>
